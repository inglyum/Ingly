<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>INGLY OS V2 — Tool completo (demo offline)</title>
<link rel="stylesheet" href="./src/styles.css">
<style>
  body{ margin:0; background:var(--bg,#0b0f14); color:var(--txt,#e5e7eb); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  #demo-banner{ position:fixed; z-index:60; right:12px; bottom:12px; display:flex; gap:8px; align-items:center;
    background:var(--card,#111827); border:1px solid var(--bd,#1f2937); border-radius:10px; padding:8px 12px; box-shadow:0 8px 24px rgba(0,0,0,.3); font-size:12px }
  #demo-banner select{ background:var(--bg,#0b0f14); color:inherit; border:1px solid var(--bd,#1f2937); border-radius:6px; padding:4px 6px }
  #app{ min-height:100vh }
</style>
</head><body>
<div id="app"></div>
<div id="demo-banner">
  🧪 Demo offline (mock, nessuna staging) · Ruolo:
  <select id="demo-role">
    <option>OWNER</option><option>ADMIN</option><option>MANAGER</option>
    <option selected>SALES</option><option>VIEWER</option>
  </select>
</div>

<script type="module">
import { renderShell } from './src/app.js';
import { mountRouter } from './src/router.js';

// ── Mock Supabase in memoria (subset usato dai data-layer) ──────────────────
function makeMock(store){
  let uid = 2000; const now = () => new Date().toISOString();
  function builder(table){
    const st = { table, filters:[], op:'select', payload:null, orderBy:null, asc:true, lim:null };
    const api = {
      select(){ return api; },
      is(c,v){ st.filters.push(r => r[c]===v || (v===null && r[c]==null)); return api; },
      eq(c,v){ st.filters.push(r => String(r[c])===String(v)); return api; },
      or(expr){ const parts=String(expr).split(',').map(p=>{const m=p.match(/^(\w+)\.ilike\.%(.*)%$/);return m?{col:m[1],q:m[2].toLowerCase()}:null;}).filter(Boolean);
        st.filters.push(r => parts.some(p => String(r[p.col]||'').toLowerCase().includes(p.q))); return api; },
      order(c,o){ st.orderBy=c; st.asc=!o||o.ascending; return api; },
      limit(n){ st.lim=n; return api; },
      insert(row){ st.op='insert'; st.payload=row; return api; },
      update(row){ st.op='update'; st.payload=row; return api; },
      single(){ return Promise.resolve(run(st,'single')); },
      maybeSingle(){ return Promise.resolve(run(st,'maybe')); },
      then(res,rej){ return Promise.resolve(run(st,'many')).then(res,rej); },
    };
    return api;
  }
  function run(st,mode){
    const arr = store[st.table] || (store[st.table]=[]);
    if(st.op==='insert'){ const row={ id:'id'+(++uid), created_at:now(), ...st.payload }; arr.push(row); return { data:row, error:null }; }
    if(st.op==='update'){ let rows=arr.filter(r=>st.filters.every(f=>f(r))); rows.forEach(r=>Object.assign(r,st.payload)); return { data:rows[0]||null, error:null }; }
    let rows=arr.filter(r=>st.filters.every(f=>f(r)));
    if(st.orderBy) rows=rows.slice().sort((a,b)=>(a[st.orderBy]>b[st.orderBy]?1:-1)*(st.asc?1:-1));
    if(st.lim) rows=rows.slice(0,st.lim);
    if(mode==='single') return { data:rows[0]||null, error: rows[0]?null:{message:'no row'} };
    if(mode==='maybe') return { data:rows[0]||null, error:null };
    return { data:rows, error:null };
  }
  return { from:t=>builder(t) };
}

function seed(){
  return {
    crm_company:[
      { id:'co1', tenant_id:'t1', name:'Belìce Eventi Srl', vat:'IT01234567890', tags:['wedding','B2B'], deleted_at:null },
      { id:'co2', tenant_id:'t1', name:'Ristorante Ortigia', vat:'IT09876543210', tags:['horeca'], deleted_at:null },
    ],
    crm_customer:[
      { id:'c1', tenant_id:'t1', company_id:'co1', name:'Maria Russo', email:'maria@belice.it', phone:'091111222', segment:'Wedding', type:'B2B', value_cached:1240, notes:'Cliente storico', deleted_at:null },
      { id:'c2', tenant_id:'t1', company_id:null, name:'Giulio Bianchi', email:'giulio@gmail.com', phone:'333444555', segment:'Regali', type:'B2C', value_cached:180, deleted_at:null },
      { id:'c3', tenant_id:'t1', company_id:'co2', name:'Chef Nino', email:'nino@ortigia.it', phone:'0931999', segment:'Horeca', type:'B2B', value_cached:640, deleted_at:null },
    ],
    crm_contact:[
      { id:'k1', tenant_id:'t1', customer_id:'c1', name:'Anna Lo Verde', role:'Wedding planner', email:'anna@belice.it', phone:'0912223', deleted_at:null },
    ],
    crm_activity:[
      { id:'a1', tenant_id:'t1', customer_id:'c1', type:'meeting', body:'Sopralluogo sala', occurred_at:'2026-08-10' },
      { id:'a2', tenant_id:'t1', customer_id:'c3', type:'call', body:'Preventivo menu QR', occurred_at:'2026-08-18' },
    ],
    catalog_product:[
      { id:'p1', tenant_id:'t1', sku:'TRG-A5', name:'Targa A5 incisa', category:'Targhe', kind:'product', price:29.90, cost:8, unit:'pz', active:true, deleted_at:null },
      { id:'p2', tenant_id:'t1', sku:'QR-MENU', name:'QR Menu ristorante', category:'Ristoranti', kind:'service', price:19.90, cost:2, unit:'pz', active:true, deleted_at:null },
      { id:'p3', tenant_id:'t1', sku:'CAKE-T', name:'Cake topper personalizzato', category:'Eventi', kind:'product', price:24.90, cost:6, unit:'pz', active:true, deleted_at:null },
    ],
  };
}

const store = seed();
const sb = makeMock(store);
const app = document.getElementById('app');

function ctx(){
  const role = document.getElementById('demo-role').value;
  return { activeTenant:'t1', tenantIds:['t1'], roles:{ t1: role }, email:'demo@ingly.test' };
}
function render(){
  if(!location.hash) location.hash = '#/dashboard';
  app.innerHTML = renderShell(ctx(), (location.hash||'').replace(/^#\/?/,'') || 'dashboard');
  mountRouter(app, ctx(), sb);
  // filtro sidebar
  const ns = app.querySelector('#v2-nav-search');
  if(ns) ns.addEventListener('input', ()=>{ const q=ns.value.toLowerCase().trim();
    app.querySelectorAll('#v2-nav .v2-nav-item').forEach(a=>{ a.style.display = (!q||a.textContent.toLowerCase().includes(q))?'':'none'; });
    app.querySelectorAll('#v2-nav .v2-nav-group').forEach(g=>{ const any=[...g.querySelectorAll('.v2-nav-item')].some(a=>a.style.display!=='none'); g.style.display=any?'':'none'; });
  });
}
document.getElementById('demo-role').addEventListener('change', render);
render();
</script>
</body></html>
