function makeMock(store){
  let uid = 2000; const now = () => new Date().toISOString(); const r2=n=>Math.round((Number(n)||0)*100)/100;
  const counters = {}; for(const c of (store.sales_quote_counter||[])) counters['sales_quote'+c.tenant_id]=(c.next_val||1)-1;
  const HDR={ sales_quote_line:['sales_quote','quote_id'], sales_order_line:['sales_order','order_id'], sales_invoice_line:['sales_invoice','invoice_id'], purchase_order_line:['purchase_order','purchase_order_id'] };
  function recalc(lt, hdr, fk, id){ const ls=(store[lt]||[]).filter(l=>l[fk]===id); const h=(store[hdr]||[]).find(x=>x.id===id); if(!h)return;
    h.subtotal=r2(ls.reduce((s,l)=>s+l.quantity*l.unit_price,0)); h.discount=r2(ls.reduce((s,l)=>s+(l.discount||0),0));
    h.tax=r2(ls.reduce((s,l)=>s+(l.tax||0),0)); h.total=r2(ls.reduce((s,l)=>s+l.line_total,0)); }
  function onInsert(table,row){
    if(table==='sales_quote'||table==='sales_order'){ const pfx=table==='sales_quote'?'PREV':'ORD'; const key=table+row.tenant_id;
      counters[key]=(counters[key]||0)+1; row.number=pfx+'-'+String(counters[key]).padStart(6,'0');
      row.status=row.status||(table==='sales_quote'?'DRAFT':'CONFIRMED'); row.subtotal=row.discount=row.tax=row.total=0;
      if(table==='sales_quote'){ if(!row.valid_until){ const d=new Date(); d.setDate(d.getDate()+7); row.valid_until=d.toISOString().slice(0,10); } row.issue_date=row.issue_date||now().slice(0,10); }
      else { row.order_date=row.order_date||now().slice(0,10); } }
    if(table==='sales_invoice'){ const y=row.year||(row.issue_date?Number(String(row.issue_date).slice(0,4)):new Date().getFullYear()); const key=table+row.tenant_id+y;
      counters[key]=(counters[key]||0)+1; row.year=y; row.number='FATT-'+y+'-'+String(counters[key]).padStart(6,'0');
      row.status=row.status||'DRAFT'; row.subtotal=row.discount=row.tax=row.total=0; row.paid_total=row.paid_total||0;
      row.issue_date=row.issue_date||now().slice(0,10); if(!row.due_date){ const d=new Date(); d.setDate(d.getDate()+30); row.due_date=d.toISOString().slice(0,10); } }
    if(table==='production_order'){ const key='PRD'+row.tenant_id; counters[key]=(counters[key]||0)+1; row.number='PRD-'+String(counters[key]).padStart(6,'0'); row.status=row.status||'PLANNED'; }
    if(table==='shipment'){ const key='SPED'+row.tenant_id; counters[key]=(counters[key]||0)+1; row.number='SPED-'+String(counters[key]).padStart(6,'0'); row.status=row.status||'PREPARING'; }
    if(table==='project'){ const key='PRJ'+row.tenant_id; counters[key]=(counters[key]||0)+1; row.code='PRJ-'+String(counters[key]).padStart(6,'0'); row.status=row.status||'PLANNED'; }
    if(table==='purchase_order'){ const key='PO'+row.tenant_id; counters[key]=(counters[key]||0)+1; row.number='ACQ-'+String(counters[key]).padStart(6,'0'); row.status=row.status||'DRAFT'; row.subtotal=row.discount=row.tax=row.total=0; row.order_date=row.order_date||now().slice(0,10); }
    if(table.endsWith('_line')){ row.line_total=r2(row.quantity*row.unit_price-(row.discount||0)+(row.tax||0)); }
  }
  function applyPayments(invId){ const inv=(store.sales_invoice||[]).find(i=>i.id===invId); if(!inv)return;
    const paid=r2((store.sales_payment||[]).filter(p=>p.invoice_id===invId&&p.deleted_at==null).reduce((s,p)=>s+p.amount,0));
    inv.paid_total=paid; if(!['CANCELLED','DRAFT'].includes(inv.status)){ const today=now().slice(0,10);
      if(paid>=inv.total&&inv.total>0)inv.status='PAID'; else if(paid>0)inv.status='PARTIALLY_PAID';
      else if(inv.due_date&&inv.due_date<today)inv.status='OVERDUE'; else inv.status='ISSUED'; } }
  function validatePay(row){ if(row.deleted_at!=null)return; const inv=(store.sales_invoice||[]).find(i=>i.id===row.invoice_id);
    const total=inv?inv.total:0; const paid=(store.sales_payment||[]).filter(p=>p.invoice_id===row.invoice_id&&p.deleted_at==null).reduce((s,p)=>s+p.amount,0);
    if(!row.allow_overpayment&&row.amount>(total-paid)+0.001){ const e=new Error('superiore al residuo'); e.code='23514'; throw e; } }
  function builder(table){
    const st = { table, filters:[], op:'select', payload:null, orderBy:null, asc:true, lim:null };
    const api = {
      select(){ return api; },
      is(c,v){ st.filters.push(r => r[c]===v || (v===null && r[c]==null)); return api; },
      eq(c,v){ st.filters.push(r => String(r[c])===String(v)); return api; },
      or(expr){ const parts=String(expr).split(',').map(p=>{const m=p.match(/^(\w+)\.ilike\.%(.*)%$/);return m?{col:m[1],q:m[2].toLowerCase()}:null;}).filter(Boolean);
        st.filters.push(r => parts.some(p => String(r[p.col]||'').toLowerCase().includes(p.q))); return api; },
      order(c,o){ st.orderBy=c; st.asc=!o||o.ascending; return api; },
      limit(n){ st.lim=n; return api; },
      insert(row){ st.op='insert'; st.payload=row; return api; },
      update(row){ st.op='update'; st.payload=row; return api; },
      delete(){ st.op='delete'; return api; },
      single(){ return Promise.resolve(run(st,'single')); },
      maybeSingle(){ return Promise.resolve(run(st,'maybe')); },
      then(res,rej){ return Promise.resolve(run(st,'many')).then(res,rej); },
    };
    return api;
  }
  function run(st,mode){
    const arr = store[st.table] || (store[st.table]=[]);
    if(st.op==='insert'){ const row={ id:'id'+(++uid), created_at:now(), deleted_at:(st.table==='sales_payment'?null:undefined), ...st.payload }; onInsert(st.table,row);
      if(st.table==='sales_payment'){ try{ validatePay(row); }catch(e){ return { data:null, error:{message:e.message,code:e.code} }; } }
      arr.push(row);
      if(HDR[st.table]){ const [h,fk]=HDR[st.table]; recalc(st.table,h,fk,row[fk]); }
      if(st.table==='sales_payment') applyPayments(row.invoice_id); return { data:row, error:null }; }
    if(st.op==='update'){ let rows=arr.filter(r=>st.filters.every(f=>f(r))); rows.forEach(r=>Object.assign(r,st.payload));
      if(HDR[st.table]){ const [h,fk]=HDR[st.table]; rows.forEach(r=>{ r.line_total=r2(r.quantity*r.unit_price-(r.discount||0)+(r.tax||0)); recalc(st.table,h,fk,r[fk]); }); }
      if(st.table==='sales_payment') rows.forEach(r=>applyPayments(r.invoice_id)); return { data:rows[0]||null, error:null }; }
    if(st.op==='delete'){ const rem=arr.filter(r=>st.filters.every(f=>f(r))); rem.forEach(r=>arr.splice(arr.indexOf(r),1));
      if(HDR[st.table]){ const [h,fk]=HDR[st.table]; rem.forEach(r=>recalc(st.table,h,fk,r[fk])); } return { data:null, error:null }; }
    let rows=arr.filter(r=>st.filters.every(f=>f(r)));
    if(st.orderBy) rows=rows.slice().sort((a,b)=>{const x=a[st.orderBy],y=b[st.orderBy]; if(x===y)return 0; return (x>y?1:-1)*(st.asc?1:-1);});
    if(st.lim) rows=rows.slice(0,st.lim);
    if(mode==='single') return { data:rows[0]||null, error: rows[0]?null:{message:'no row'} };
    if(mode==='maybe') return { data:rows[0]||null, error:null };
    return { data:rows, error:null };
  }
  return { from:t=>builder(t) };
}

  app.innerHTML = renderShell(ctx(), (location.hash||'').replace(/^#\/?/,'') || 'dashboard');
  mountRouter(app, ctx(), sb);
  // filtro sidebar
  const ns = app.querySelector('#v2-nav-search');
  if(ns) ns.addEventListener('input', ()=>{ const q=ns.value.toLowerCase().trim();
    app.querySelectorAll('#v2-nav .v2-nav-item').forEach(a=>{ a.style.display = (!q||a.textContent.toLowerCase().includes(q))?'':'none'; });
    app.querySelectorAll('#v2-nav .v2-nav-group').forEach(g=>{ const any=[...g.querySelectorAll('.v2-nav-item')].some(a=>a.style.display!=='none'); g.style.display=any?'':'none'; });
  });
}
