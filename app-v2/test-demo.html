<script type="module">
import { mount as mountCrm } from './src/crm-ui.js';
import { mount as mountDashboard } from './src/dashboard-ui.js';

// ── Mock Supabase in memoria (subset usato da crm.js/dashboard.js) ──────────
function makeMock(store){
  let uid = 1000;
  const now = () => new Date().toISOString();
  function builder(table){
    const st = { table, filters:[], op:'select', payload:null, orderBy:null, asc:true, lim:null };
    const api = {
      select(){ return api; },
      is(c,v){ st.filters.push(r => r[c]===v || (v===null && r[c]==null)); return api; },
      eq(c,v){ st.filters.push(r => String(r[c])===String(v)); return api; },
      or(expr){ const parts=expr.split(',').map(p=>{const m=p.match(/^(\w+)\.ilike\.%(.*)%$/);return m?{col:m[1],q:m[2].toLowerCase()}:null;}).filter(Boolean);
        st.filters.push(r => parts.some(p => String(r[p.col]||'').toLowerCase().includes(p.q))); return api; },
      order(c,o){ st.orderBy=c; st.asc=!o||o.ascending; return api; },
      limit(n){ st.lim=n; return api; },
      insert(row){ st.op='insert'; st.payload=row; return api; },
      update(row){ st.op='update'; st.payload=row; return api; },
      single(){ return Promise.resolve(run(st,'single')); },
      maybeSingle(){ return Promise.resolve(run(st,'maybe')); },
      then(res,rej){ return Promise.resolve(run(st,'many')).then(res,rej); },
    };
    return api;
  }
  function run(st,mode){
    const arr = store[st.table] || (store[st.table]=[]);
    if(st.op==='insert'){ const row={ id:'id'+(++uid), created_at:now(), ...st.payload }; arr.push(row); return { data:row, error:null }; }
    if(st.op==='update'){ let rows=arr.filter(r=>st.filters.every(f=>f(r))); rows.forEach(r=>Object.assign(r,st.payload)); return { data:rows[0]||null, error:null }; }
    let rows=arr.filter(r=>st.filters.every(f=>f(r)));
    if(st.orderBy) rows=rows.slice().sort((a,b)=>(a[st.orderBy]>b[st.orderBy]?1:-1)*(st.asc?1:-1));
    if(st.lim) rows=rows.slice(0,st.lim);
    if(mode==='single') return { data:rows[0]||null, error: rows[0]?null:{message:'no row'} };
    if(mode==='maybe') return { data:rows[0]||null, error:null };
    return { data:rows, error:null };
  }
  return { from:t=>builder(t) };
}

// Dati demo

      { id:'co2', tenant_id:'t1', name:'Ristorante Ortigia', vat:'IT09876543210', tags:['horeca'], deleted_at:null },
    ],
    crm_customer:[
      { id:'c1', tenant_id:'t1', company_id:'co1', name:'Maria Russo', email:'maria@belice.it', phone:'091111222', segment:'Wedding', type:'B2B', value_cached:1240, notes:'Cliente storico', deleted_at:null },
      { id:'c2', tenant_id:'t1', company_id:null, name:'Giulio Bianchi', email:'giulio@gmail.com', phone:'333444555', segment:'Regali', type:'B2C', value_cached:180, deleted_at:null },
      { id:'c3', tenant_id:'t1', company_id:'co2', name:'Chef Nino', email:'nino@ortigia.it', phone:'0931999', segment:'Horeca', type:'B2B', value_cached:640, deleted_at:null },
    ],
    crm_contact:[
      { id:'k1', tenant_id:'t1', customer_id:'c1', name:'Anna Lo Verde', role:'Wedding planner', email:'anna@belice.it', phone:'0912223', deleted_at:null },
    ],
    crm_activity:[
      { id:'a1', tenant_id:'t1', customer_id:'c1', type:'meeting', body:'Sopralluogo sala', occurred_at:'2026-08-10' },
      { id:'a2', tenant_id:'t1', customer_id:'c3', type:'call', body:'Preventivo menu QR', occurred_at:'2026-08-18' },
    ],

}

const store = seed();
const sb = makeMock(store);
const view = document.getElementById('demo-view');

function ctx(){ return { activeTenant:'t1', roles:{ t1: document.getElementById('role').value } }; }

function show(which){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active', b.getAttribute('data-view')===which));
  if(which==='dashboard'){ view.innerHTML='<div data-dash-pane></div>'; mountDashboard(view,{ sb }); }
  else { view.innerHTML='<div data-crm-root></div>'; mountCrm(view,{ sb, ctx: ctx() }); }
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.getAttribute('data-view'))));
document.getElementById('role').addEventListener('change',()=>{ const active=document.querySelector('[data-view].active').getAttribute('data-view'); show(active); });
show('dashboard');
</script>
